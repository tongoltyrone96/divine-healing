# Runs the app on an iOS simulator and captures every main screen.
#
# There is no iPhone on this project. Until this existed, nothing had ever
# run the iOS binary — builds went straight from compiling to TestFlight, and
# a crash on launch would have been discovered by the client.
#
# It also produces the App Store screenshots. A simulator screenshot is at
# the device's native resolution, so an iPhone 16 Pro Max gives 1320x2868 —
# exactly Apple's 6.9" requirement, with nothing to scale or pad.
#
# What it cannot do: Sign in with Apple. The simulator answers that with
# "Sign in to your iPhone" unless an Apple ID is signed in, and putting real
# credentials on a runner is not worth it. That check needs a real device.
#
# Cost: macOS minutes bill at 10x on a private repo. Roughly eight builds a
# month between this and the TestFlight workflow.

name: iOS — Simulator

on:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator model
        required: false
        default: iPhone 17 Pro Max

env:
  FLUTTER_VERSION: 3.47.1
  # The publishable Supabase pair, same as the TestFlight workflow. Without
  # these the app falls back to local-only mode and the screenshots would show
  # an empty catalogue.
  SUPABASE_URL: https://buzdtsupgmytqokgfsbn.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_7m-bk8K9-pW7CUEu-3Dnyg_dpaZWQDa

jobs:
  screenshots:
    runs-on: macos-latest
    # A healthy run takes about 16 minutes. flutter drive occasionally
    # never connects to the app after the Xcode build finishes and then
    # sits there — one such hang burned 45 minutes, which is 450 against
    # the allowance at the 10x macOS rate. Cut the loss sooner.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install packages
        working-directory: divine_healing
        run: flutter pub get

      - name: Boot the simulator
        id: sim
        run: |
          WANTED="${{ inputs.device }}"
          # Runner images rename and renumber devices between releases, so the
          # requested model is a preference, not a requirement. The fallback
          # looks for any Pro Max before settling for any iPhone at all:
          # Apple accepts only certain screenshot sizes, and 6.9" means a Pro
          # Max at 1320x2868. A plain iPhone 17 gives 1206x2622, which is a
          # perfectly good smoke test and a screenshot the store will reject.
          # `set -e` is on and an assignment carries the exit status of its
          # command substitution, so an unmatched grep would end the step
          # before the fallback below ever ran.
          UDID=$(xcrun simctl list devices available \
            | grep -F "$WANTED (" | head -1 \
            | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}' || true)
          # Apple wants a 13-inch iPad set as well as the 6.9" iPhone one, so
          # the fallbacks have to stay inside whichever family was asked for.
          # Falling back from an iPad to an iPhone would produce screenshots
          # that upload cleanly and are then rejected for their dimensions.
          case "$WANTED" in
            iPad*) FAMILY=iPad; PREFERRED='iPad Pro.*(13|12.9)-inch' ;;
            *)     FAMILY=iPhone; PREFERRED='iPhone.*Pro Max' ;;
          esac
          if [ -z "$UDID" ]; then
            echo "::warning::$WANTED not available; looking for $PREFERRED"
            UDID=$(xcrun simctl list devices available \
              | grep -E "^[[:space:]]+$PREFERRED" | tail -1 \
              | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}' || true)
          fi
          if [ -z "$UDID" ]; then
            echo "::warning::nothing preferred either; screenshots will be the"
            echo "::warning::wrong size for the App Store, but the run still"
            echo "::warning::proves the app launches"
            UDID=$(xcrun simctl list devices available \
              | grep -E "^[[:space:]]+$FAMILY" | tail -1 \
              | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}' || true)
          fi
          [ -n "$UDID" ] || { xcrun simctl list devices available; exit 1; }

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          NAME=$(xcrun simctl list devices | grep "$UDID" \
            | sed -E 's/^ *(.*) \(.*/\1/' || true)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Booted $NAME  ($UDID)"

          # Status bar is baked into every screenshot, so it may as well read
          # the way Apple's own marketing shots do rather than showing a
          # runner's battery level.
          # Cosmetic only — not worth failing the run over on a device model
          # that rejects one of the flags.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 || true

      - name: Run the app and capture the screens
        working-directory: divine_healing
        run: |
          flutter drive \
            --driver test_driver/integration_test.dart \
            --target integration_test/screenshots_test.dart \
            -d "${{ steps.sim.outputs.udid }}" \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Report what was captured
        if: always()
        working-directory: divine_healing
        run: |
          if [ -d screenshots ]; then
            for f in screenshots/*.png; do
              echo "$(basename "$f")  $(sips -g pixelWidth -g pixelHeight "$f" \
                | awk '/pixel/ {printf "%s ", $2}')"
            done
          else
            echo "::warning::No screenshots directory — the run captured nothing"
          fi

      - name: Collect crash reports
        if: always()
        run: |
          # Only useful when the app died on launch, which is the failure this
          # workflow exists to catch.
          mkdir -p "$RUNNER_TEMP/crashes"
          find ~/Library/Logs/DiagnosticReports -name '*Runner*' \
            -exec cp {} "$RUNNER_TEMP/crashes/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/crashes" || true

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-${{ github.run_number }}
          path: |
            divine_healing/screenshots/*.png
            ${{ runner.temp }}/crashes/*
          if-no-files-found: warn
          retention-days: 30
