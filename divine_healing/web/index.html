<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Guided meditations, shadow work, chakra healing and Reiki by Strawberry Hope.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Divine Healing">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Divine Healing by Strawberry Hope</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pre-Flutter splash: matches the in-app splash so the load feels
       seamless instead of blank-white → app. Uses the sageMist blush from
       the Flutter theme. -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #FCF5F8; }
    #boot-splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #FFFFFF 0%, #FCF5F8 100%);
      z-index: 1;
      transition: opacity 400ms ease-out;
    }
    #boot-splash img { width: 260px; height: 260px; object-fit: contain; }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot-splash">
    <img src="assets/assets/logo/client_logo.png" alt="Divine Healing" />
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Fade out the boot splash once Flutter has taken over the screen.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-splash');
      if (el) {
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 450);
      }
    });
  </script>
</body>
</html>
