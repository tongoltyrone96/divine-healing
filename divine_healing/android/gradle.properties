org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dhttp.connectionTimeout=180000 -Dhttp.socketTimeout=180000 -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Longer network timeouts so the first-run artifact download survives
# transient connection resets on flaky links.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000

# AGP will install missing SDK packages itself, through a downloader with no
# read timeout. On this machine's VPN a stalled transfer means it blocks on a
# socket read forever: a build sat for an hour inside
# DefaultSdkLoader.installRemotePackages with ten CLOSE-WAIT sockets to Google
# and left a platforms/android-34 directory containing nothing at all.
#
# Off, a missing package is an immediate error naming what is absent, which is
# then fetched with automation/wsl/05_prefetch_sdk_packages.sh.
android.builder.sdkDownload=false
