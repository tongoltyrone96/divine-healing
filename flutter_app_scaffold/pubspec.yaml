# Divine Healing — Flutter dependency manifest
# Copy to project root after `flutter create` (replaces auto-generated one)
name: divine_healing
description: Divine Healing — guided meditations, shadow work, reiki (Strawberry Hope)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- UI / typography ---
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # --- Routing & state ---
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Data models (immutable + JSON) ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Backend (Supabase) ---
  supabase_flutter: ^2.8.0

  # --- Auth providers ---
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3      # iOS-required for App Store approval when Google is present

  # --- Audio player (M2) ---
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # --- Payments (M2 — RevenueCat wraps Apple IAP + Google Billing + Stripe) ---
  purchases_flutter: ^8.2.1

  # --- Local storage & prefs ---
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # --- Utilities ---
  intl: ^0.19.0
  url_launcher: ^6.3.1             # for Booking → Zoom/Square link
  webview_flutter: ^4.10.0         # if Booking is embedded rather than launched externally
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation for Freezed + Riverpod + JSON
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

  # Splash + Icon generators
  flutter_native_splash: ^2.4.2
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true  # for l10n if we add multi-language later

  assets:
    - assets/content/                # static JSON (affirmations, chakras, etc.)
    - assets/images/
    - assets/icons/
    # audio NOT bundled — served from Supabase Storage to keep app size small

# ============================================================================
# Splash & Launcher Icon Generators — run once after design assets are in
# ============================================================================
# flutter_native_splash: flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#4A6F5A"                    # Forest Green
  color_dark: "#4A6F5A"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#4A6F5A"
    image: assets/images/splash_logo_android12.png
  ios: true
  android: true
  web: false
  fullscreen: false

# flutter_launcher_icons: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#4A6F5A"
  adaptive_icon_background: "#4A6F5A"
  adaptive_icon_foreground: "assets/images/app_icon_adaptive.png"
