# iOS builds for Divine Healing.
#
# There is no Mac on this project, so iOS is built on Codemagic's macOS
# machines. Android is not here — it builds locally under WSL, because
# Astrill VPN's Winsock LSP crashes Gradle's JVM on Windows. See
# automation/wsl/ and CLAUDE.md.
#
# ---------------------------------------------------------------------------
# One-time setup in the Codemagic UI before the first run
# ---------------------------------------------------------------------------
# 1. Add this repository (github.com/tongoltyrone96/divine-healing, private).
#
# 2. Teams > Integrations > Developer Portal > add an App Store Connect key
#    named exactly "divine-healing-asc" (the name this file refers to):
#      Issuer ID  027e6790-d592-4674-ada9-714978737be5
#      Key ID     6T97H3MRDZ
#      .p8        AuthKey_6T97H3MRDZ.p8  (kept out of git; ask Tyrone)
#
#    That key has Admin access, so Codemagic creates the distribution
#    certificate and provisioning profile itself. Nothing to upload by hand.
#
# 3. Nothing else. The Supabase values below are the publishable pair and are
#    already in the shipped web bundle, so they live here rather than in a
#    variable group — one less thing to configure, and no secret in it. The
#    Stripe secret key is NOT here and must never be: it is server-side only.

workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: divine-healing-asc

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.divinehealing.app
      vars:
        # Numeric App Store Connect id, from the app's URL. Used to look up
        # the last TestFlight build so this one lands above it.
        APP_STORE_APP_ID: 6806764325
        # The publishable Supabase pair, matching divine_healing/.env. Kept as
        # plain vars rather than a YAML anchor: anchors do not expand inside a
        # script block, which fails as a confusing "file not found".
        SUPABASE_URL: https://buzdtsupgmytqokgfsbn.supabase.co
        SUPABASE_ANON_KEY: sb_publishable_7m-bk8K9-pW7CUEu-3Dnyg_dpaZWQDa
      flutter: 3.47.1
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install packages
        script: |
          cd divine_healing
          flutter pub get

      - name: Set build number from TestFlight
        script: |
          cd divine_healing
          # pubspec's build number is maintained for Play, where it is already
          # at 3. TestFlight rejects a build number it has seen before, and the
          # two stores do not share a counter, so the iOS number is derived
          # from what App Store Connect actually holds.
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          NEXT=$(( ${LATEST:-0} + 1 ))
          echo "TestFlight is at ${LATEST:-0}; building $NEXT"
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV

      - name: Fetch signing files
        script: |
          cd divine_healing
          # Creates the certificate and profile if the team has none yet, then
          # writes them into the Xcode project, which is set to automatic
          # signing with no team baked in.
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd divine_healing
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - divine_healing/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - divine_healing/build/**/outputs/**/mapping.txt

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Not submitted for review from here. Review needs the paid
        # applications agreement to be active and in-app purchases to exist,
        # neither of which is true yet.
        submit_to_app_store: false

      email:
        recipients:
          - tongoltyrone84@gmail.com
        notify:
          success: true
          failure: true
